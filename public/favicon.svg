    <path d="M24 42 C24 42, 14 40, 12 33 C10 26, 14 22, 14 22 C12 20, 8 16, 10 11 C12 6, 17 4, 20 6 C22 2, 28 2, 30 6"
      stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
