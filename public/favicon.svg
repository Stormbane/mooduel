    <circle cx="38" cy="0" r="2.5" fill="#1ED760"/>
    <circle cx="30" cy="-7" r="3" fill="#8B5CF6"/>
    <circle cx="15" cy="0" r="2" fill="#38BDF8"/>
    <circle cx="44" cy="-4" r="1.8" fill="#FBBF24"/>
    <circle cx="26" cy="-12" r="1.8" fill="#FF6B6B"/>
  </g>
</svg>
